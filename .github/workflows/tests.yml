name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /tests/
            /scripts/
            /hellofresh/*.js
            /hellofresh/*.html
            /hellofresh/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest 'Pillow>=10,<13' 'pypdf>=5,<7'
      - run: PYTHONPATH=. pytest -q
      - run: python scripts/audit_recipe_library.py --output /tmp/library_source_audit.json
      - run: python -c "import json; d=json.load(open('/tmp/library_source_audit.json')); assert d['summary']['records_audited'] == len(d['records']) and d['summary']['records_audited'] >= 725"
      - run: python -m compileall -q app.py scanner.py render_original_cards.py render_plated_cards.py import_plated_release.py sync_market_deals.py
      - run: node --check hellofresh/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python audit_recipe_quality.py --output /tmp/recipe_quality_audit.json
