name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall -q app.py scanner.py
