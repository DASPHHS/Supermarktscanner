name: Plated pdfs scannen
on:
  push:
    paths:
      - 'plated_pdfs/**'
      - 'import_plated_from_repo.py'
      - 'drive_plated_sync.py'
      - '.github/workflows/plated-import.yml'
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Aantal PDF bestanden in deze batch (1-50)'
        required: false
        default: '20'
permissions:
  contents: write
concurrency:
  group: plated-import
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer OCR voor scans
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Verwerk nieuwe Plated-PDF's uit GitHub
        run: python import_plated_from_repo.py --folder plated_pdfs --batch "${{ github.event.inputs.batch_size || '20' }}"
      - name: Behoud streng prijsveiligheidsbeleid
        run: |
          python - <<'PY'
          import json
          with open('plated_local_review_queue.json', encoding='utf8') as f:
              queue=json.load(f)
          assert all(r.get('pricing_eligible') is False for r in queue['recipes'])
          print('Ongecontroleerde recepten uitgesloten van definitieve prijsranking')
          PY
      - name: Bewaar OCR-resultaten en status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plated_local_state.json plated_local_review_queue.json plated_local_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Plated PDF review queue"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
