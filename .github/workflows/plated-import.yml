name: Plated pdfs scannen
on:
  push:
    paths:
      - 'plated_pdfs/**'
      - 'plated_drive_manifest.json'
      - 'import_plated_from_repo.py'
      - 'import_plated_public_drive.py'
      - 'drive_plated_sync.py'
      - 'tests/test_drive_plated_sync.py'
      - '.github/workflows/plated-import.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Aantal PDF-bestanden per run (1-80)'
        required: false
        default: '60'
permissions:
  contents: write
concurrency:
  group: plated-import
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer PDF en OCR hulpmiddelen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng
          pip install 'gdown>=5.2,<6'
      - name: Verwerk Plated PDF's vanaf de gedeelde Drive-map
        if: hashFiles('plated_drive_manifest.json') != ''
        run: python import_plated_public_drive.py --batch "${{ github.event.inputs.batch_size || '60' }}"
      - name: Verwerk eventuele PDF uploads naar GitHub
        run: python import_plated_from_repo.py --folder plated_pdfs --batch 50
      - name: Beveilig prijsdata tegen OCR fouten
        run: |
          python - <<'PY'
          import json
          for name in ('plated_drive_public_review_queue.json','plated_local_review_queue.json'):
              with open(name,encoding='utf-8') as fp:
                  records=json.load(fp)['recipes']
              assert all(r.get('pricing_eligible') is False for r in records)
          print('Alle OCR-extracties blijven onder handmatige controle, geen fictieve prijzen')
          PY
      - name: Bewaar importresultaten zonder conflicten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/plated-results"
          for f in plated_drive_public_state.json plated_drive_public_review_queue.json plated_drive_public_progress.json plated_local_state.json plated_local_review_queue.json plated_local_progress.json; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/plated-results/$f"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python merge_plated_results.py --source "$RUNNER_TEMP/plated-results"
            git add plated_drive_public_state.json plated_drive_public_review_queue.json plated_drive_public_progress.json plated_local_state.json plated_local_review_queue.json plated_local_progress.json
            if git diff --cached --quiet; then
              echo "Import is al opgeslagen"
              exit 0
            fi
            git commit -m "Update Plated import batches"
            if git push origin HEAD:main; then
              echo "Importresultaten opgeslagen"
              exit 0
            fi
            echo "Repository veranderde tijdens het opslaan; nieuwe poging"
          done
          exit 1
