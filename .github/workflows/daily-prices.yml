name: Dagelijkse supermarktprijzen
on:
  push:
    paths:
      - "sync_prices.py"
      - "tests/test_sync_prices.py"
      - "recipes_extracted.json"
      - ".github/workflows/daily-prices.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controleer import en matching
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_sync_prices.py
      - name: Ververs gecontroleerde schapprijzen
        run: python sync_prices.py
      - name: Bewaar prijssnapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp recipe_prices.json "$RUNNER_TEMP/recipe_prices.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/recipe_prices.json" recipe_prices.json
            git add recipe_prices.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update supermarket price snapshot"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
