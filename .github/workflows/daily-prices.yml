name: Dagelijkse supermarktprijzen
on:
  push:
    paths:
      - "sync_prices.py"
      - "sync_market_deals.py"
      - "verified_rankings.py"
      - "price_verifications.json"
      - "tests/test_verified_rankings.py"
      - "indicative_prices.py"
      - "tests/test_indicative_prices.py"
      - "market_deals.json"
      - "tests/test_sync_prices.py"
      - "recipes_extracted.json"
      - ".github/workflows/daily-prices.yml"
  schedule:
    - cron: "40 6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-supermarket-prices
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controleer import en matching
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_sync_prices.py tests/test_indicative_prices.py tests/test_verified_rankings.py
      - name: Ververs actuele productprijzen en aanbiedingen
        continue-on-error: true
        run: python sync_market_deals.py
      - name: Ververs gecontroleerde schapprijzen
        run: python sync_prices.py
      - name: Maak uitsluitend handmatig bevestigde top 10 voor twee personen
        run: python verified_rankings.py
      - name: Bewaar prijssnapshot en geverifieerde ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp market_deals.json "$RUNNER_TEMP/market_deals.json"
          cp recipe_prices.json "$RUNNER_TEMP/recipe_prices.json"
          cp verified_rankings.json "$RUNNER_TEMP/verified_rankings.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/market_deals.json" market_deals.json
            cp "$RUNNER_TEMP/recipe_prices.json" recipe_prices.json
            cp "$RUNNER_TEMP/verified_rankings.json" verified_rankings.json
            git add market_deals.json recipe_prices.json verified_rankings.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update supermarket price snapshot"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
