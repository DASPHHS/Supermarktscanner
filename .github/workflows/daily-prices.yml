name: Dagelijkse supermarktprijzen
on:
  push:
    paths:
      - "sync_prices.py"
      - "recipes_extracted.json"
      - ".github/workflows/daily-prices.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controleer import en matching
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_sync_prices.py
      - name: Ververs gecontroleerde schapprijzen
        run: python sync_prices.py
      - name: Bewaar prijssnapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipe_prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update supermarket price snapshot"
            git push
          fi
